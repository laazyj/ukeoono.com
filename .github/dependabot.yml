version: 2
updates:
  # npm workspaces: the root lockfile covers both packages, so a single entry
  # at "/" keeps the root and the cdk/site workspaces in sync.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised or
    # yanked version has time to be caught upstream first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # CDK ships most weekdays and its bumps churn the synth snapshots, so it
      # gets its own PR instead of being buried in the routine batch. Listed
      # first on purpose: a dependency joins the first group it matches.
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk-lib"
          - "constructs"
        update-types:
          - minor
          - patch
      # Batch routine bumps into one PR; majors still come through on their own.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7.0 lacks the compiler APIs typescript-eslint needs; 7.1
      # adds them. Its PR stays red until typescript-eslint's peer range
      # accepts 7.1, so merge it then and drop this entry.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <7.1.0"]

  # Keep the SHA-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
