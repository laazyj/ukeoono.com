name: zizmor

# Static analysis of the workflows and dependabot.yml for GitHub Actions security
# issues (credential persistence, template injection, over-broad permissions, missing
# Dependabot cooldown, and so on).
#
# Runs on every PR into main, whatever files it touches (a .github/** path filter would
# leave unrelated PRs waiting forever on this required check), and on every push to
# main, so each commit there is audited even when PRs merge out of order.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  # Only superseded PR runs: a cancelled run on main would leave that commit unaudited.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotations rather than SARIF (Advanced Security), so any finding fails the
      # check. The SHA pin also pins zizmor's version.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
